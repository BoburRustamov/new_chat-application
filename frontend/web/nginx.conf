# =============================================================================
# NGINX CONFIGURATION
# =============================================================================
# Nginx is a web server that serves your React files and routes API requests.
#
# WHAT THIS DOES:
# 1. Serves your React app's static files (HTML, CSS, JS)
# 2. Handles client-side routing (React Router)
# 3. Adds security headers
# 4. Enables gzip compression for faster loading
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # GZIP COMPRESSION
    # ---------------------------------------------------------------------
    # Compresses files before sending to browser = faster page loads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # ---------------------------------------------------------------------
    # SECURITY HEADERS
    # ---------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # STATIC FILE CACHING
    # ---------------------------------------------------------------------
    # Cache JS/CSS files for 1 year (they have unique hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # REACT ROUTER SUPPORT
    # ---------------------------------------------------------------------
    # This is crucial for Single Page Applications!
    # When user navigates to /chat/123, nginx should serve index.html
    # and let React Router handle the routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ---------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
